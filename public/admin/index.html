<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Screenshot Gallery CMS</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      .cms-notice {
        margin: 16px;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        background: #ffffff;
        font-size: 14px;
        line-height: 1.5;
      }

      .cms-notice strong {
        display: block;
        margin-bottom: 4px;
      }

      .cms-error {
        border-color: #fca5a5;
        background: #fff1f2;
      }

      .cms-meta {
        margin-top: 8px;
        font-size: 12px;
        color: #475569;
      }

      .cms-actions {
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .cms-actions button,
      .cms-actions a {
        border: 1px solid #0f766e;
        background: #0f766e;
        color: #ffffff;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 14px;
        cursor: pointer;
        text-decoration: none;
      }

      .cms-actions a.secondary {
        border-color: #94a3b8;
        background: #ffffff;
        color: #0f172a;
      }

      .cms-actions button:focus-visible,
      .cms-actions a:focus-visible {
        outline: 2px solid #14b8a6;
        outline-offset: 2px;
      }
    </style>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="cms-status" class="cms-notice" role="status" aria-live="polite">
      <strong>Loading CMS login...</strong>
      Initializing Netlify Identity and Decap CMS.
      <div class="cms-meta">If this hangs, open <a href="/admin/debug">/admin/debug</a> for diagnostics.</div>
      <div class="cms-actions">
        <button id="open-login" type="button">Open Login</button>
        <a class="secondary" href="/admin/debug">Open Debug</a>
      </div>
    </div>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      (function () {
        var statusEl = document.getElementById("cms-status");
        var loginButton = document.getElementById("open-login");
        var tokenKeys = ["invite_token", "confirmation_token", "recovery_token", "email_change_token"];

        function hasNetlifyToken() {
          var hash = window.location.hash ? window.location.hash.replace(/^#/, "") : "";
          var query = window.location.search ? window.location.search.replace(/^\?/, "") : "";
          var hashParams = new URLSearchParams(hash);
          var queryParams = new URLSearchParams(query);

          for (var i = 0; i < tokenKeys.length; i += 1) {
            var key = tokenKeys[i];
            if (hashParams.get(key) || queryParams.get(key)) {
              return true;
            }
          }

          return false;
        }

        function setStatus(title, details, isError) {
          if (!statusEl) return;

          statusEl.className = isError ? "cms-notice cms-error" : "cms-notice";
          statusEl.innerHTML =
            "<strong>" +
            title +
            "</strong>" +
            details +
            '<div class="cms-meta">Need help? See <a href="/admin/debug">/admin/debug</a>.</div>' +
            '<div class="cms-actions">' +
            '<button id="open-login" type="button">Open Login</button>' +
            '<a class="secondary" href="/admin/debug">Open Debug</a>' +
            "</div>";

          var updatedButton = document.getElementById("open-login");
          if (updatedButton) {
            updatedButton.addEventListener("click", function () {
              if (window.netlifyIdentity && window.netlifyIdentity.open) {
                window.netlifyIdentity.open("login");
              }
            });
          }
        }

        function showLoginFailure(extraMessage) {
          var details =
            "Identity might not be enabled, Git Gateway might not be enabled, or your invite email may not be confirmed.";
          if (extraMessage) {
            details += " Details: " + extraMessage;
          }

          setStatus("CMS login failed", details, true);
        }

        function openLogin() {
          if (!window.netlifyIdentity || !window.netlifyIdentity.open) {
            showLoginFailure("Netlify Identity widget did not load.");
            return;
          }

          if (hasNetlifyToken()) {
            window.netlifyIdentity.open("signup");
          } else {
            window.netlifyIdentity.open("login");
          }
        }

        if (loginButton) {
          loginButton.addEventListener("click", openLogin);
        }

        if (!window.netlifyIdentity) {
          showLoginFailure("Netlify Identity widget script is missing or blocked.");
          return;
        }

        window.netlifyIdentity.on("error", function (error) {
          showLoginFailure(error && error.message ? error.message : "Unknown Identity error.");
        });

        window.netlifyIdentity.on("init", function (user) {
          if (user) {
            setStatus("Logged in", "Authentication succeeded. Redirecting to CMS...", false);
            return;
          }

          if (hasNetlifyToken()) {
            setStatus(
              "Complete account setup",
              "Invite or confirmation token detected. Complete signup/login in the modal, then you will return to CMS.",
              false,
            );
            openLogin();
            return;
          }

          setStatus(
            "Ready to login",
            "Use the login modal to continue. If your invite was just accepted, open the invite link again or use Open Login.",
            false,
          );
        });

        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin/";
        });

        window.netlifyIdentity.on("logout", function () {
          setStatus("Logged out", "You have been signed out.", false);
        });

        window.netlifyIdentity.init();
      })();
    </script>
  </body>
</html>
